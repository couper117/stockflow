# CI for the merged single-codebase StockFlow (Next.js + Postgres RLS).
# Extended in SF-007 with: migrate-from-empty, rls-guard, tenant-isolation,
# i18n-key-parity, and gitleaks secret-scan. The legacy/ Laravel+Next reference
# is intentionally NOT built here.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  app:
    name: App (Next.js · Node 20)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockflow
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://stockflow:secret@localhost:5432/stockflow
      DATABASE_URL_MIGRATE: postgres://stockflow:secret@localhost:5432/stockflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate from empty
        run: npm run db:migrate
      - name: Test (unit + integration, incl. i18n parity + tenant isolation + rls-guard)
        run: npm run test
      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
